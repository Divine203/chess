<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" href="./android-chrome-512x512.png">
<title>FreeChess</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;touch-action:none}
.game{width:100dvw;height:100dvh;display:flex;justify-content:center;align-items:center}
.board-wrap{position:relative;width:min(100vw,100dvh);height:min(100vw,100dvh)}
#board{position:absolute;inset:0;width:100%;height:100%;z-index:10;touch-action:none}
.board-cont{position:absolute;left:0;top:0;width:480px;height:480px;transform-origin:top left;pointer-events:none;z-index:1}
.board-cont div{position:absolute}
</style>
</head>
<body>
<div class="game"><div class="board-wrap"><canvas id="board"></canvas><div class="board-cont"></div></div></div>

<!-- External libs -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<!-- Core files -->
<script src="utils.js?v=minimal"></script>
<script src="pieces.js?v=minimal"></script>
<script src="board.js?v=minimal"></script>
<script src="rules.js?v=minimal"></script>
<script src="general.js?v=minimal"></script>
<script src="sound.js?v=minimal"></script>
<script src="stockfish.js?v=minimal"></script>
<script src="controls.js?v=minimal"></script>
<script src="mobile.js?v=minimal"></script>
<script src="game-ui.js?v=minimal"></script>
<script src="stats.js?v=minimal"></script>
<script src="main.js?v=minimal"></script>

</body>
</html>
